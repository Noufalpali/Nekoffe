<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Nekoffe</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Nekoffe ^_^</div>
        <nav><a href="order.html">&larr; Back to Order</a></nav>
    </header>

    <main class="order-page">
        <div class="order-container">
            <div class="section-title">
                <h1>Payment</h1>
                <p>Check your order and choose how to pay</p>
            </div>

            <div class="form-section">
                <h2>Your Order</h2>
                <div id="payItems"></div>
                <div class="row total"><span>Subtotal</span><span id="paySubtotal"></span></div>
            </div>

            <div class="form-section">
                <h2>Payment Method</h2>
                <div id="methods"></div>
                <div id="methodDetail" class="method-detail"></div>
            </div>

            <div class="submit-area">
                <button id="payBtn" class="button" disabled>Select a payment method</button>
            </div>
        </div>
    </main>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/payment.js"></script>
</body>
</html>
