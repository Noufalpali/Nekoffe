<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/extra.css">
</head>

<body class = login-page>

    <div class="login">

        <h2>Login as a Member</h2>

        <p id="error">Username atau password salah!</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <a href="index.html" class="back">Back to Home</a>

    </div>

    <script src="assets/js/data.js"></script>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const member = MEMBERS.find(m =>
                m.username === username &&
                m.password === password
            );

            if (member) {
                store.set("member", member);
                location.href = "pages/order.html";
            } else {
                document.getElementById("error").style.display = "block";
            }
        });
    </script>

<script src="assets/js/site.js"></script>
</body>
</html>
