<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Order-Nekoffe</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">
            Nekoffe ^_^
        </div>
        <nav>

            <a href="index.html">
                Home
            </a>
            <a href="index.html#about">
                About Us
            </a>
            <a href="index.html#menu">
                Our Menu
            </a>
        </nav>
    </header>

    <!-- ORDER PAGE -->
    <main class="order-page">
        <form>
            <div class="order-container">
                <div class="section-title">
                    <h1>
                        Start Ordering Now
                    </h1>
                    <p>
                        Choose your dish today~
                    </p>
                </div>


                <!-- CUSTOMER INFORMATION -->
                <div class="form-section">
                    <h2>
                        Customer Information
                    </h2>

                    <div class="form-group">
                        <label for="name">
                            Name
                        </label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Your name"
                            required
                        >
                    </div>
                </div>

                <!-- MENU -->
                <div class="form-section">
                    <h2>
                        Choose Your Menu
                    </h2>
                    <p class="form-description">
                        You can choose more than one menu.
                    </p>
                    <div class="menu-selection">
                        <!-- MENU 1 -->
                        <label class="menu-option">
                            <input
                                type="checkbox"
                                name="menu"
                                value="Americano"
                            >
                            <img
                                src="americanp.jpg"
                                alt="Americano"
                            >
                            <div class="menu-info">
                                <h3>
                                    Americano
                                </h3>
                                <span>
                                    Rp20.000
                                </span>
                            </div>
                        </label>

                        <!-- MENU 2 -->
                        <label class="menu-option">
                            <input
                                type="checkbox"
                                name="menu"
                                value="Cafe Latte"
                            >
                            <img
                                src="latte.jpg"
                                alt="Cafe Latte"
                            >
                            <div class="menu-info">
                                <h3>
                                    Cafe Latte
                                </h3>
                                <span>
                                    Rp25.000
                                </span>
                            </div>
                        </label>

                        <!-- MENU 3 -->
                        <label class="menu-option">
                            <input
                                type="checkbox"
                                name="menu"
                                value="Cafe Mocha"
                            >
                            <img
                                src="mocha.jpg"
                                alt="Cafe Mocha"
                            >
                            <div class="menu-info">

                                <h3>
                                    Cafe Mocha
                                </h3>
                                <span>
                                    Rp25.000
                                </span>
                            </div>
                        </label>

                        <!-- MENU 4 -->
                        <label class="menu-option">
                            <input
                                type="checkbox"
                                name="menu"
                                value="Caramel Macchiato"
                            >
                            <img
                                src="machiato.jpg"
                                alt="Caramel Macchiato"
                            >
                            <div class="menu-info">
                                <h3>
                                    Caramel Macchiato
                                </h3>
                                <span>
                                    Rp32.000
                                </span>
                            </div>
                        </label>

                        <!-- MENU 5 -->
                        <label class="menu-option">
                            <input
                                type="checkbox"
                                name="menu"
                                value="Melon Cream Soda"
                            >
                            <img
                                src="melon.jpg"
                                alt="Melon Cream Soda"
                            >
                            <div class="menu-info">
                                <h3>
                                    Melon Cream Soda
                                </h3>
                                <span>
                                    Rp28.000
                                </span>
                            </div>
                        </label>

                        <!-- MENU 6 -->
                        <label class="menu-option">
                            <input
                                type="checkbox"
                                name="menu"
                                value="Roll Cake"
                            >
                            <img
                                src="rollcake.jpg"
                                alt="Roll Cake"
                            >
                            <div class="menu-info">
                                <h3>
                                    Roll Cake
                                </h3>
                                <span>
                                    Rp25.000
                                </span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- SUGAR -->
                <div class="form-section">
                    <h2>
                        Sugar Amount
                    </h2>
                    <div class="sugar-options">
                        <label>
                            <input
                                type="radio"
                                name="sugar"
                                value="100%"
                                checked
                            >
                            100%
                        </label>
                        <label>
                            <input
                                type="radio"
                                name="sugar"
                                value="75%"
                            >
                            75%
                        </label>
                        <label>
                            <input
                                type="radio"
                                name="sugar"
                                value="50%"
                            >
                            50%
                        </label>
                        <label>
                            <input
                                type="radio"
                                name="sugar"
                                value="25%"
                            >
                            25%
                        </label>
                        <label>
                            <input
                                type="radio"
                                name="sugar"
                                value="0%"
                            >
                            0%
                        </label>
                    </div>
                </div>

                <!-- ORDER TYPE -->
                <div class="form-section">
                    <h2>
                        Order Type
                    </h2>
                    <div class="order-type">
                        <label>
                            <input
                                type="radio"
                                name="order_type"
                                value="pickup"
                                checked
                            >
                            Pick Up
                        </label>
                        <label>
                            <input
                                type="radio"
                                name="order_type"
                                value="delivery"
                            >
                            Delivery
                        </label>
                    </div>
                </div>

                <!-- ADDRESS / NOTES -->
                <div class="form-section">
                    <h2>
                        Address / Notes
                    </h2>
                    <textarea
                        name="address"
                        rows="5"
                        placeholder="Write your address or special notes..."
                    ></textarea>
                </div>

                <!-- PAYMENT -->
                <div class="form-section">
                    <h2>
                        Payment Method
                    </h2>
                    <select name="payment">
                        <option value="">
                            -- Select Payment --
                        </option>
                        <option value="cash">
                            Cash
                        </option>
                        <option value="qris">
                            QRIS
                        </option>
                        <option value="transfer">
                            Bank Transfer
                        </option>
                    </select>
                </div>

                <!-- SUBMIT -->
